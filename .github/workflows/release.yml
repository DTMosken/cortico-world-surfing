name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Prepare a version PR or publish the version on main
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - publish

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  CORTICO_REF: 9ad634a298d40cee6ba8b68162ea9f49dd220bab

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: extension

    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
        working-directory: .

      - name: Check out extension
        uses: actions/checkout@v7
        with:
          path: extension
          fetch-depth: 0

      - name: Check out Cortico
        uses: actions/checkout@v7
        with:
          repository: Pal-AI-Lab/Cortico
          ref: ${{ env.CORTICO_REF }}
          path: Cortico
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json

      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install Cortico dependencies
        working-directory: Cortico
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare version
        if: inputs.release_type != 'publish'
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          npm pkg set repository.type=git "repository.url=git+https://github.com/$GITHUB_REPOSITORY.git"

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check extension
        working-directory: Cortico
        run: pnpm check:extension ../extension

      - name: Audit release files
        run: node ../Cortico/node_modules/tsx/dist/cli.mjs ../Cortico/scripts/release-audit.ts

      - name: Pack release
        id: package
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pack] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const file of [pkg.main, pkg.cortico.consoleClient, 'dist/page-engine.mjs', 'src/ENV_PROMPT.md', 'scripts/install-browser.mjs', 'README.md', 'LICENSE']) {
            if (!pack.files.some((entry) => entry.path === file.replace(/^\.\//, ''))) {
              throw new Error('Release is missing ' + file);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'tarball=' + join(process.env.RUNNER_TEMP, pack.filename),
            'name=' + pkg.name,
            'version=' + pkg.version,
            '',
          ].join('\n'));
          console.log(pkg.name + '@' + pkg.version + ': ' + pack.files.length + ' files');
          NODE

      - name: Open version PR
        if: inputs.release_type != 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          branch="release/v$PACKAGE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json
          git commit -m "build(package.json): release $PACKAGE_VERSION"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          更新 npm 包版本为 $PACKAGE_VERSION，并记录源码仓库地址。

          通过 CI 与审批后合并，再在 main 运行 Release 并选择 publish。
          EOF
          pr_url=$(gh pr create --base main --head "$branch" --title "build(package.json): release $PACKAGE_VERSION" --body-file "$RUNNER_TEMP/release-pr.md")
          gh workflow run ci.yml --ref "$branch"
          printf 'Version PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Read npm publication status
        if: inputs.release_type == 'publish'
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 > "$RUNNER_TEMP/npm-version.txt" 2> "$RUNNER_TEMP/npm-error.txt"; then
            test "$(cat "$RUNNER_TEMP/npm-version.txt")" = "$PACKAGE_VERSION"
            echo 'published=true' >> "$GITHUB_OUTPUT"
          elif grep -q E404 "$RUNNER_TEMP/npm-error.txt"; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-error.txt" >&2
            exit 1
          fi

      - name: Push version tag
        if: inputs.release_type == 'publish'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$PACKAGE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$PACKAGE_NAME $PACKAGE_VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish to npm
        if: inputs.release_type == 'publish' && steps.npm.outputs.published != 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --registry=https://registry.npmjs.org

      - name: Verify npm version
        if: inputs.release_type == 'publish'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for attempt in {1..12}; do
            exact=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)
            latest=$(npm view "$PACKAGE_NAME" dist-tags.latest --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)
            if [ "$exact" = "$PACKAGE_VERSION" ] && [ "$latest" = "$PACKAGE_VERSION" ]; then
              printf 'Published [%s@%s](https://www.npmjs.com/package/%s/v/%s)\n' "$PACKAGE_NAME" "$PACKAGE_VERSION" "$PACKAGE_NAME" "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          printf 'Registry did not confirm %s@%s: exact=%s latest=%s\n' "$PACKAGE_NAME" "$PACKAGE_VERSION" "$exact" "$latest" >&2
          exit 1

      - name: Create GitHub Release
        if: inputs.release_type == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'GitHub Release already exists: %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$tag" "$TARBALL" --verify-tag --title "$PACKAGE_NAME $PACKAGE_VERSION" --generate-notes
          fi
